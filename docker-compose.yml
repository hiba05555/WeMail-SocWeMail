networks:
  wemail-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mongodb-data:

services:

  # ── DATABASES ──────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: wemail-postgres
    environment:
      POSTGRES_USER: wemail
      POSTGRES_PASSWORD: wemail123
      POSTGRES_DB: wemail
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wemail-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wemail"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wemail-redis
    volumes:
      - redis-data:/data
    networks:
      - wemail-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: wemail-mongodb
    volumes:
      - mongodb-data:/data/db
    networks:
      - wemail-network
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: wemail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wemail
      MINIO_ROOT_PASSWORD: wemail123
    volumes:
      - minio-data:/data
    networks:
      - wemail-network
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── MICROSERVICES ───────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: wemail-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EMAIL_SERVICE_URL=http://email-service:8002
      - CHAT_SERVICE_URL=http://chat-service:3001
      - CALENDAR_SERVICE_URL=http://calendar-service:3002
      - FILE_SERVICE_URL=http://file-storage-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - wemail-network

  auth-service:
    build: ./auth-service
    container_name: wemail-auth
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://wemail:wemail123@postgres:5432/wemail
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=wemail-super-secret-jwt-key-2024
      - JWT_EXPIRE_MINUTES=60
      - SOC_URL=http://soc-backend:8888
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wemail-network

  email-service:
    build: ./email-service
    container_name: wemail-email
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://wemail:wemail123@postgres:5432/wemail
      - REDIS_URL=redis://redis:6379
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=wemail
      - MINIO_SECRET_KEY=wemail123
      - SOC_URL=http://soc-backend:8888
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wemail-network

  chat-service:
    build: ./chat-service
    container_name: wemail-chat
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/wemail-chat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=wemail-super-secret-jwt-key-2024
      - SOC_URL=http://soc-backend:8888
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wemail-network

  calendar-service:
    build: ./calendar-service
    container_name: wemail-calendar
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://wemail:wemail123@postgres:5432/wemail
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=wemail-super-secret-jwt-key-2024
      - SOC_URL=http://soc-backend:8888
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wemail-network

  file-storage-service:
    build: ./file-storage-service
    container_name: wemail-files
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://wemail:wemail123@postgres:5432/wemail
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=wemail
      - MINIO_SECRET_KEY=wemail123
      - JWT_SECRET=wemail-super-secret-jwt-key-2024
      - SOC_URL=http://soc-backend:8888
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wemail-network

  notification-service:
    build: ./notification-service
    container_name: wemail-notifications
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/wemail-notifications
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=wemail-super-secret-jwt-key-2024
      - TWILIO_ACCOUNT_SID=your-twilio-sid
      - TWILIO_AUTH_TOKEN=your-twilio-token
      - TWILIO_WHATSAPP_FROM=whatsapp:+14155238886
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wemail-network

  # ── SOC PLATFORM ────────────────────────────────────────
  soc-backend:
    build: ./soc-platform/backend
    container_name: wemail-soc-backend
    ports:
      - "8888:8888"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/wemail-soc
      - JWT_SECRET=wemail-soc-secret-key-2024
      - TWILIO_ACCOUNT_SID=your-twilio-sid
      - TWILIO_AUTH_TOKEN=your-twilio-token
      - TWILIO_FROM=your-twilio-number
      - ALERT_PHONE=your-alert-number
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wemail-network
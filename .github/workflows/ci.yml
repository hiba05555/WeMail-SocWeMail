name: WeMail CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test-auth:
    name: Test Auth Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: cd auth-service && pip install -r requirements.txt
      - name: Test imports
        run: |
          cd auth-service
          python -c "from src.security import hash_password, verify_password, create_access_token; print('OK')"

  test-email:
    name: Test Email Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: cd email-service && pip install -r requirements.txt
      - name: Test imports
        run: |
          cd email-service
          python -c "from src.schemas import EmailSend, EmailResponse; print('OK')"

  test-soc:
    name: Test SOC Detection Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: cd soc-platform/backend && pip install -r requirements.txt
      - name: Write test file
        run: |
          cat > /tmp/test_detection.py << 'PYEOF'
from src.detection import analyze
from datetime import datetime

# Test brute force
alerts = []
for i in range(6):
    result = analyze({
        "service": "auth",
        "event_type": "login_failed",
        "ip": "192.168.1.100",
        "email": "test@wemail.io",
        "details": {},
        "timestamp": datetime.utcnow()
    })
    alerts.extend(result)

bf = [a for a in alerts if a["rule"] == "brute_force"]
assert len(bf) > 0, "Brute force not detected!"
print("PASS: Brute force detection OK")

# Test SQLi
result = analyze({
    "service": "email",
    "event_type": "email_sent",
    "ip": "10.0.0.1",
    "email": "test@wemail.io",
    "details": {"subject": "test OR 1=1 --"},
    "timestamp": datetime.utcnow()
})
sqli = [a for a in result if a["rule"] == "sql_injection"]
assert len(sqli) > 0, "SQLi not detected!"
print("PASS: SQL Injection detection OK")

# Test XSS
result = analyze({
    "service": "email",
    "event_type": "email_sent",
    "ip": "10.0.0.1",
    "email": "test@wemail.io",
    "details": {"body": "<script>alert(1)</script>"},
    "timestamp": datetime.utcnow()
})
xss = [a for a in result if a["rule"] == "xss"]
assert len(xss) > 0, "XSS not detected!"
print("PASS: XSS detection OK")

print("ALL TESTS PASSED")
PYEOF
      - name: Run detection tests
        run: |
          cd soc-platform/backend
          python /tmp/test_detection.py

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-auth, test-email, test-soc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build auth-service
        run: docker build ./auth-service -t wemail-auth:latest
      - name: Build email-service
        run: docker build ./email-service -t wemail-email:latest
      - name: Build soc-backend
        run: docker build ./soc-platform/backend -t wemail-soc:latest
      - name: Build frontend
        run: |
          cd frontend/wemail-frontend
          npm install
          npm run build
          echo "Frontend build OK"
      - name: All builds successful
        run: echo "All Docker images built successfully"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -r "wemail123" --include="*.py" --include="*.js" --include="*.jsx" --exclude-dir=node_modules . | grep -v "docker-compose\|config.py\|\.env"; then
            echo "Warning: hardcoded passwords found in source"
          else
            echo "OK: No hardcoded secrets in source files"
          fi
          echo "Security scan complete"
